name: Yo'qlama cron

# Opens the nightly attendance session in each dorm's configured window and
# pushes residents; auto-closes expired sessions. Also drives the dekan
# roll-calls: opens scheduled ones and sends the 10-minute Telegram/email
# reminders (hence every 5 minutes — GitHub may delay a run by a few). The endpoint is idempotent,
# so a missed or doubled run is harmless.
#
# Setup: add ATTENDANCE_CRON_SECRET as a repo secret (Settings → Secrets and
# variables → Actions) with the same value as the Vercel project env var.

# The schedule now lives in Supabase pg_cron (job 'attendance-cron', every 5 min):
# GitHub's scheduler only fired every few hours in practice. This workflow stays
# as a manual trigger (workflow_dispatch).
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: attendance-cron
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger attendance cron
        env:
          CRON_SECRET: ${{ secrets.ATTENDANCE_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "ATTENDANCE_CRON_SECRET is not set — skipping."
            exit 0
          fi
          code=$(curl -sS -o /tmp/body -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://www.meningyotoqxonam.uz/api/attendance/cron)
          echo "HTTP $code"
          cat /tmp/body
          echo
          test "$code" = "200"

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: npm audit (retry on registry errors)
        run: |
          for attempt in 1 2 3 4; do
            out=$(npm audit --omit=dev --audit-level=high 2>&1) && exit 0
            echo "$out"
            if ! echo "$out" | grep -qiE 'audit endpoint returned an error|Service Unavailable|Gateway Time-?out|Error code 5[0-9][0-9]|Internal Server Error|ECONNRESET|ETIMEDOUT|EAI_AGAIN|socket hang up'; then
              echo "::error::npm audit found high-severity vulnerabilities"
              exit 1
            fi
            echo "::warning::npm audit registry unreachable (attempt $attempt) — retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          echo "::warning::npm audit skipped — registry unreachable after 4 attempts"

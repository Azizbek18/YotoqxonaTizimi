name: Viza eslatmalari cron

# Xorijiy talabalarning viza / propiska muddati tugash eslatmalarini yuboradi
# (talabaga 30/15/10/5/3/0 kun qolganda + muddat o'tgach 7 kun; dekanga digest).
# Endpoint jurnal orqali idempotent — o'tkazib yuborilgan yoki takror ish zararsiz.
#
# Sozlash: VISA_CRON_SECRET ni repo secret sifatida qo'shing (Settings →
# Secrets and variables → Actions), qiymati Vercel loyihasidagi env bilan bir xil.

on:
  schedule:
    # 01:00 UTC = 06:00 Asia/Tashkent
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: visa-reminders-cron
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger visa reminder cron
        env:
          CRON_SECRET: ${{ secrets.VISA_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "VISA_CRON_SECRET is not set — skipping."
            exit 0
          fi
          code=$(curl -sS -o /tmp/body -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://www.meningyotoqxonam.uz/api/visa/cron)
          echo "HTTP $code"
          cat /tmp/body
          echo
          test "$code" = "200"

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Reduced from the Flutter template's default -Xmx8G: this machine only has
# ~7.68GB total RAM, so an 8G heap request alone would starve everything else.
org.gradle.jvmargs=-Xmx1536m
org.gradle.parallel=false
org.gradle.caching=false
# Kotlin's incremental-cache path relocation crashes when the pub cache (C:)
# and this project (D:) are on different drive letters (can't compute a
# relative path across drive roots on Windows) — disable incremental
# compilation to avoid it.
kotlin.incremental=false
